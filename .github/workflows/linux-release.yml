# Publishes `linux-vX.Y.Z` when `linux` changes what users install, and only after the same build passed
# the tests of linux-ci.yml (no game needed; the real-server tests of tests/linux/integration run by
# hand before moving a game profile). The release files are the exact ones CI built and tested. Users are not moved by a new release: the game panel
# pins a tag per game profile, and moving a profile to the new tag is a decision made there.
# The version follows what changed (tools/linux-release/next_version.sh): major for breaking changes,
# minor for features (`feat:` commits, new mods), patch for the rest; `Release: major|minor|patch` in a
# commit message overrides it.
name: Linux release

on:
  push:
    branches: [linux]
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if nothing users install changed since the last tag"
        type: boolean
        default: false
      bump:
        description: "Version bump (auto: decided from the commits since the last tag)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: linux-release
  cancel-in-progress: false

jobs:
  uepseudo:
    name: UEPseudo linux follows the pin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Fast-forward ocristopfer/UEPseudo linux to the commit this branch uses
        # The upstream sync merges UEPseudo on its `sync/upstream` branch; once that pull request is
        # merged here, UEPseudo's `linux` moves to the same commit (fast-forward only).
        env:
          TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::FORK_SYNC_TOKEN is not set; UEPseudo linux not checked"; exit 0; fi
          pin=$(git rev-parse HEAD:deps/first/Unreal)
          git clone -q --bare --filter=blob:none "https://x-access-token:$TOKEN@github.com/ocristopfer/UEPseudo.git" uep
          cd uep
          git fetch -q origin "$pin" || { echo "::error::UEPseudo $pin is not on ocristopfer/UEPseudo"; exit 1; }
          if git merge-base --is-ancestor "$pin" linux; then echo "UEPseudo linux already contains $pin"; exit 0; fi
          git merge-base --is-ancestor linux "$pin" || { echo "::error::UEPseudo linux diverged from $pin"; exit 1; }
          git push -q origin "$pin:refs/heads/linux"
          echo "UEPseudo linux -> $pin"

  changes:
    name: Anything users install changed?
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.check.outputs.release }}
      previous: ${{ steps.check.outputs.previous }}
      next: ${{ steps.check.outputs.next }}
      bump: ${{ steps.check.outputs.bump }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: check
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -o pipefail
          bash tools/linux-release/next_version.sh "$BUMP" "$FORCE" | tee -a "$GITHUB_OUTPUT"
      - name: Summary
        env:
          RELEASE: ${{ steps.check.outputs.release }}
          NEXT: ${{ steps.check.outputs.next }}
          BUMP: ${{ steps.check.outputs.bump }}
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          if [ "$RELEASE" = true ]; then
            echo "Next release: **$NEXT** ($BUMP: $REASON)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: $REASON." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: CI
    needs: [uepseudo, changes]
    if: needs.changes.outputs.release == 'true'
    uses: ./.github/workflows/linux-ci.yml
    secrets: inherit

  publish:
    name: Publish
    needs: [changes, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIOUS: ${{ needs.changes.outputs.previous }}
      TAG: ${{ needs.changes.outputs.next }}
      BUMP: ${{ needs.changes.outputs.bump }}
      REASON: ${{ needs.changes.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: release
      - name: Files match their SHA256SUMS
        run: cd release && sha256sum -c SHA256SUMS
      - name: Notes
        run: |
          {
            echo "UE4SS built for native Linux Unreal Engine games, loaded with \`LD_PRELOAD\`. See [docs/linux.md](https://github.com/$GITHUB_REPOSITORY/blob/linux/docs/linux.md)."
            echo
            [ -z "$PREVIOUS" ] || echo "Version: $BUMP over $PREVIOUS - $REASON."
            echo
            echo "Built from \`$(git rev-parse --short HEAD)\`. The Linux CI tests (tests/linux: Itanium ABI rules, scanner, exports, a simulated server startup) passed with these exact files."
            echo "The tests on real dedicated servers (tests/linux/integration) are run by hand before a game profile of the panel moves to this tag."
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "### Changes since $PREVIOUS"
              echo
              echo "Linux port:"
              git log --no-merges --format='- %s (%h)' --author='Cristopfer' "$PREVIOUS..HEAD" | head -60
              echo
              echo "From upstream (UE4SS-RE/RE-UE4SS):"
              git log --no-merges --format='- %s (%h)' --perl-regexp --author='^((?!Cristopfer).*)$' "$PREVIOUS..HEAD" | head -80
              echo
              pin_old=$(git rev-parse "$PREVIOUS:deps/first/Unreal")
              pin_new=$(git rev-parse HEAD:deps/first/Unreal)
              [ "$pin_old" = "$pin_new" ] || echo "UEPseudo: [$(echo $pin_old | cut -c1-7)...$(echo $pin_new | cut -c1-7)](https://github.com/ocristopfer/UEPseudo/compare/$pin_old...$pin_new)"
            fi
            echo
            echo "Files are listed with their hashes in \`SHA256SUMS\`. The game panel installs a release only when its game profile is moved to this tag."
          } > notes.md
          cat notes.md
      - name: Release
        run: |
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "UE4SS for Linux ${TAG#linux-}" --notes-file notes.md --latest
