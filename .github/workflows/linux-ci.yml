# Linux build of the fork: libUE4SS.so with Clang and the tests of tests/linux, which need no game
# (Itanium ABI rules, the scanner, the exports, the library inert outside a game, and a simulated
# server startup). Runs on every pull request into `linux` (the upstream sync ones included) and is
# called by linux-release.yml before anything is published. The integration tests on real dedicated
# servers (tests/linux/integration) are not run here: they run by hand, on a machine that has them.
name: Linux CI

on:
  pull_request:
    branches: [linux]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Game__Shipping__Linux

jobs:
  build:
    name: Build and tests
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Submodules
        # UEPseudo (ocristopfer/UEPseudo) is private, like upstream's: FORK_SYNC_TOKEN reads it.
        # patternsleuth is declared with an SSH URL; the runner fetches over HTTPS.
        env:
          TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::the FORK_SYNC_TOKEN secret is needed to fetch the private UEPseudo submodule"; exit 1; fi
          git -c url."https://x-access-token:${TOKEN}@github.com/ocristopfer/UEPseudo".insteadOf="https://github.com/ocristopfer/UEPseudo" \
              -c url."https://github.com/".insteadOf="git@github.com:" \
              submodule update --init --recursive --depth 1

      - name: Toolchain (Clang 20, Ninja, ccache)
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang-20 lld-20 llvm-20 ninja-build ccache
          rustup toolchain install stable --profile minimal

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ccache
            ~/.cargo/registry
            build/cargo
          key: linux-build-${{ github.sha }}
          restore-keys: linux-build-

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -Wno-dev
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DUE4SS_GUI_ENABLED=OFF -DUE4SS_INPUT_ENABLED=OFF -DUE4SS_CONSOLE_COLORS_ENABLED=OFF
          -DUE4SS_PROFILERS=OFF -DUE4SS_LINUX_TESTS=ON

      - name: Build
        run: cmake --build build --target UE4SS linux_itanium_abi_test linux_scanner_selfscan_test

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: Python tools compile
        run: python3 -m py_compile tools/linux-layouts/*.py tests/linux/integration/run_game.py

      - name: Release candidate
        # The reference packs come from game files, not from this build: the latest release's carry over.
        run: |
          tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '[.[].tagName | select(startswith("linux-v"))] | sort_by(ltrimstr("linux-v") | split(".") | map(tonumber)) | last')
          echo "reference packs from $tag"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p LinuxReferencePacks.tar.gz -D packs
          bash tools/linux-release/package.sh "build/$BUILD_TYPE/lib/libUE4SS.so" packs/LinuxReferencePacks.tar.gz release-candidate

      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: release-candidate
          if-no-files-found: error
          retention-days: 30
